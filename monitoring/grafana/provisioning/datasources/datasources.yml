apiVersion: 1

datasources:
  # ── Prometheus ────────────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    # proxy = Grafana's backend calls Prometheus, not the browser.
    # This means the browser never needs direct access to Prometheus.
    access: proxy
    # 'prometheus' here is the Docker Compose service name — Grafana
    # resolves it via Docker's internal DNS on the same network.
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # ── Loki (log aggregation) ────────────────────────────────────────────────
  - name: Loki
    type: loki
    access: proxy
    # 'loki' is the Docker Compose service name.
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      # Link log lines to Prometheus metrics by matching the 'application' label.
      derivedFields:
        - datasourceUid: Prometheus
          matcherRegex: ""
          name: ""
          url: ""
