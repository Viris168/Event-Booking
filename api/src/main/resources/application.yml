server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: event-booking-api

  # Loads api/.env into the environment so the ${...} placeholders below pick
  # it up. Boot has no native .env support, so the file is read as a plain
  # properties file - hence the [.properties] format hint. `optional:` means
  # startup still works without a .env (CI, prod), falling back to the
  # defaults after each `:` below.
  #
  # Two paths because these resolve against the process working directory,
  # which differs by launcher: `mvn spring-boot:run` uses api/, while
  # IntelliJ's Spring Boot run config defaults to the repo root. Only one of
  # the two ever exists, so listing both makes startup launcher-independent.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./api/.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # Flyway owns the schema. It runs everything in
  # src/main/resources/db/migration (V1__schema.sql, V2__..., ...) in order
  # on startup and records what it has already applied.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      # validate = Hibernate CHECKS entities against the real tables and
      # refuses to start if they disagree. It never creates or alters
      # anything - that is Flyway's job. Do NOT set this to update.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  jackson:
    time-zone: UTC

# Custom app properties
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
    # 15-minute access token, 14-day refresh token (see architecture doc, auth design)
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  hold:
    ttl-minutes: ${HOLD_TTL_MINUTES:10}
    extension-minutes: ${HOLD_EXTENSION_MINUTES:3}
    sweeper-interval-ms: ${HOLD_SWEEPER_INTERVAL_MS:30000}
  booking:
    # Snapshotted onto every booking as fx_rate_khr_per_usd, so changing this
    # only affects bookings taken from here on. Replace with a rate feed later.
    fx-khr-per-usd: ${FX_KHR_PER_USD:4100.0000}
    # How long a booking may sit unpaid before it is expired and its seats and
    # zone capacity go back on sale.
    payment-window-minutes: ${BOOKING_PAYMENT_WINDOW_MINUTES:15}
  payment:
    bakong:
      # MOCK = real KHQR strings, simulated settlement, and the
      # /api/dev/payments/** endpoints. LIVE talks to the real API and drops
      # those endpoints entirely.
      mode: ${BAKONG_MODE:MOCK}
      base-url: ${BAKONG_BASE_URL:https://api-bakong.nbc.gov.kh}
      # Issued by NBC against a registered email. Expires - renew it before it
      # does, or every poll comes back 401 and no booking ever confirms.
      bearer-token: ${BAKONG_BEARER_TOKEN:}
      # Where the money lands, e.g. "event_booking@wing".
      account-id: ${BAKONG_ACCOUNT_ID:event_booking@dev}
      # INDIVIDUAL uses EMVCo tag 29; MERCHANT uses tag 30 and also needs the
      # two fields below.
      account-type: ${BAKONG_ACCOUNT_TYPE:INDIVIDUAL}
      merchant-id: ${BAKONG_MERCHANT_ID:}
      acquiring-bank: ${BAKONG_ACQUIRING_BANK:}
      # Shown in the payer's banking app. Hard EMVCo limits: 25 and 15
      # characters. Startup fails rather than emitting a QR banks reject.
      merchant-name: ${BAKONG_MERCHANT_NAME:Event Booking KH}
      merchant-city: ${BAKONG_MERCHANT_CITY:Phnom Penh}
      merchant-category-code: ${BAKONG_MCC:5999}
      store-label: ${BAKONG_STORE_LABEL:EventBooking}
      terminal-label: ${BAKONG_TERMINAL_LABEL:WEB}
      # KHR is what Cambodian bank apps expect. Both totals were snapshotted on
      # the booking at checkout, so this only picks which one is charged.
      currency: ${BAKONG_CURRENCY:KHR}
      # Well under the booking payment window: an abandoned QR should be
      # reclaimed while the customer still has time to start a fresh one.
      qr-ttl: ${BAKONG_QR_TTL:5m}
      connect-timeout: ${BAKONG_CONNECT_TIMEOUT:3s}
      read-timeout: ${BAKONG_READ_TIMEOUT:5s}
    poll:
      # The reconciler. Off means nothing settles by itself - a second instance
      # would want this, since the sweeps do not coordinate across processes.
      enabled: ${PAYMENT_POLL_ENABLED:true}
      interval: ${PAYMENT_POLL_INTERVAL:5s}
      batch-size: ${PAYMENT_POLL_BATCH_SIZE:50}
      # Floor between provider checks for one attempt; also the interval the API
      # tells clients to poll on.
      min-refresh-interval: ${PAYMENT_MIN_REFRESH_INTERVAL:3s}
      # The timeout that returns seats to the pool.
      booking-sweep: ${BOOKING_SWEEP_INTERVAL:1m}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}

# Swagger UI at http://localhost:8080/swagger-ui.html, spec at /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints grouped by @Tag, and the tags sorted, so the payment flow does
    # not end up scattered through the page.
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
