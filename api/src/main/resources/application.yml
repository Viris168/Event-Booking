server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: event-booking-api

  # Loads api/.env into the environment so the ${...} placeholders below pick
  # it up. Boot has no native .env support, so the file is read as a plain
  # properties file - hence the [.properties] format hint. `optional:` means
  # startup still works without a .env (CI, prod), falling back to the
  # defaults after each `:` below.
  #
  # Two paths because these resolve against the process working directory,
  # which differs by launcher: `mvn spring-boot:run` uses api/, while
  # IntelliJ's Spring Boot run config defaults to the repo root. Only one of
  # the two ever exists, so listing both makes startup launcher-independent.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./api/.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # Flyway owns the schema. It runs everything in
  # src/main/resources/db/migration (V1__schema.sql, V2__..., ...) in order
  # on startup and records what it has already applied.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      # validate = Hibernate CHECKS entities against the real tables and
      # refuses to start if they disagree. It never creates or alters
      # anything - that is Flyway's job. Do NOT set this to update.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  jackson:
    time-zone: UTC

# Custom app properties
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
    # 15-minute access token, 14-day refresh token (see architecture doc, auth design)
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  hold:
    ttl-minutes: ${HOLD_TTL_MINUTES:10}
    extension-minutes: ${HOLD_EXTENSION_MINUTES:3}
    sweeper-interval-ms: ${HOLD_SWEEPER_INTERVAL_MS:30000}
  booking:
    # Snapshotted onto every booking as fx_rate_khr_per_usd, so changing this
    # only affects bookings taken from here on. Replace with a rate feed later.
    fx-khr-per-usd: ${FX_KHR_PER_USD:4100.0000}
    # How long a booking may sit unpaid before it is expired and its seats and
    # zone capacity go back on sale.
    payment-window-minutes: ${BOOKING_PAYMENT_WINDOW_MINUTES:15}
