# Local development only.
#
# Exists so `TicketSecretGuard` can fail closed everywhere else: the guard is
# @Profile("!dev"), so a deploy that forgets to set a profile breaks loudly
# rather than quietly running on the placeholder key from the repository.
#
# Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
app:
  ticket:
    # Dev-only, and public by virtue of being in this file. Every QR signed with
    # it is forgeable by anyone with the repo — which is fine for a laptop and
    # is exactly why it must never be the value a deployment falls back to.
    signing-secret: ${TICKET_SIGNING_SECRET:dev-only-ticket-secret-not-for-any-real-event}

  auth:
    refresh-cookie:
      # http://localhost. The one place this may be false.
      secure: false

  jwt:
    # Dev-only, and public by virtue of being in this file. Anyone with the repo
    # can forge a token signed with it - fine for a laptop, and exactly why
    # JwtSecretGuard makes it impossible for a deployment to fall back here.
    secret: ${JWT_SECRET:dev-only-jwt-secret-not-for-any-deployment-32+}

spring:
  flyway:
    # The demo identities, on top of the schema. Dev only, and dev is the only
    # place they are safe: V19 gives all fifteen the BCrypt of "password" and V6
    # makes +85510111222 a PLATFORM_ADMIN. Never add classpath:db/seed to a
    # deployment's locations.
    locations: classpath:db/migration,classpath:db/seed
    # Some dev databases recorded version 24 against an early copy of the
    # phone-format script, before it was renumbered to V25. Clearing that row
    # frees the version, but V24 is then a pending version BELOW the applied
    # maximum, which Flyway refuses by default ("Detected resolved migration
    # not applied to database: 24") and skips even when validation is relaxed.
    # Dev only: a database that applied these in order has never needed it.
    out-of-order: true
