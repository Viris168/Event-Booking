name: CI

# Two independent jobs. The API and the web app share a repo and nothing else,
# so a broken frontend should not hide a green backend or vice versa.
on:
  # Every branch, not a hand-maintained list. The list had main and Dev-viris
  # on it, so two of the three developers pushed without any check running -
  # you found out your branch was broken only when you opened a PR. Actions
  # minutes are free on a public repo, so there was nothing being saved.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# One run per branch. Pushing twice in a row, or opening a PR on a branch that
# just ran, cancels the older run instead of queueing beside it.
#
# main is exempt: every commit that lands there keeps its own result, so the
# history shows which merge broke something rather than "cancelled".
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'          # matches <java.version> in api/pom.xml
          distribution: temurin
          cache: maven

      # `verify`, not `test`. Surefire runs the unit tests; the *IT.java files
      # are bound to failsafe at integration-test/verify, and `test` skips them
      # entirely — which is how they went unexecuted for the life of the repo.
      #
      # No `services:` block for Postgres: the ITs use Testcontainers, which
      # starts postgres:16-alpine itself. ubuntu-latest ships a working Docker
      # daemon at /var/run/docker.sock, so nothing else is needed.
      - name: Build and test
        working-directory: api
        # Placeholders, not secrets. CloudinaryConfig deliberately fails startup
        # when these are blank - which is right for a deployment and fatal for a
        # test run: with no api/.env on the runner, the Cloudinary bean cannot be
        # built, so CloudinaryService fails, so EventServiceimpl fails, and every
        # @SpringBootTest context dies before a single assertion runs.
        #
        # Any non-blank value satisfies it. Nothing here uploads, and the client
        # makes no network call while being constructed, so real credentials
        # would buy nothing and put secrets in a log for no reason.
        env:
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          # JwtSecretGuard refuses the placeholder committed in .env.example,
          # on the grounds that anyone who can read the repo could sign a token
          # claiming to be a platform admin. Without a value here the guard
          # fires and every @SpringBootTest fails to start a context - which is
          # what it is for, and why CI needs its own throwaway value.
          #
          # Not a secret and not worth making one: it signs nothing outside this
          # runner, and the tokens it signs live as long as the job does.
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-chars
          # Same shape of guard, same reasoning. Rotating this would invalidate
          # issued tickets in a real environment; here nothing outlives the job.
          TICKET_SIGNING_SECRET: ci-only-ticket-signing-key-at-least-32-chars
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test reports
        if: always()                  # a failed run is when these matter most
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          retention-days: 7

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # `npm run build` is already `eslint src && vite build`, so this is lint
      # and build in one step rather than two that can disagree.
      - name: Lint and build
        working-directory: web
        run: npm run build
