server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy sets the security headers and does the TLS; this server only ever
    # sees traffic that already came through it.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets (app.4f2c1d.js), so the file at
    # a given URL can never change. A year of immutable caching is safe and it
    # is the single biggest win for repeat visitors on Cambodian mobile data.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the opposite case: it names the fingerprinted bundles, so a
    # cached copy pins the browser to the PREVIOUS deploy's JavaScript — which
    # is then gone. It must be revalidated every time.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # React Router owns the URL space. A hard refresh on /events/42 asks nginx
    # for a file that was never built; without this fallback the user gets a 404
    # on a route the app handles perfectly well.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
