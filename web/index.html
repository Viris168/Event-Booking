<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons. The 32px PNG is the tab favicon, the 192px one is what desktop
         browsers pick for bookmarks and shortcuts, and apple-touch-icon must be
         a PNG at 180×180. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/logo/CB-favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/logo/CB-icon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/logo/CB-icon-180.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The browser chrome follows the site's own light/dark palette. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#062718"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#14120e"
    />
    <meta name="color-scheme" content="light dark" />

    <title>CamboBook</title>
    <meta
      name="description"
      content="Ticketing for events across the Kingdom of Cambodia — reserved seats or general admission, priced in USD and KHR, with a QR ticket at the door."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CamboBook" />
    <meta property="og:title" content="CamboBook" />
    <meta
      property="og:description"
      content="Reserved seats or general admission across all 8 provinces — pay with Bakong KHQR or ABA PayWay."
    />
    <meta property="og:image" content="/logo/CB-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Latin + Khmer faces: Khmer script needs its own family, not a fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Deferred: this is a third-party script on someone else's network, and
         without `defer` it blocks parsing of <body>, so a slow or unreachable
         PayWay leaves #root uncreated and the whole app renders as a blank
         page. Nothing runs it at load - PaywayCheckout.jsx reaches for it only
         once a user starts a payment - so it has no reason to hold up first
         paint. -->
    <script defer src="https://checkout.payway.com.kh/plugins/checkout2-0.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
