<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons. The 32px PNG is the tab favicon, the 192px one is what desktop
         browsers pick for bookmarks and shortcuts, and apple-touch-icon must be
         a PNG at 180×180. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/logo/CB-favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/logo/CB-icon-192.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/CB-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The browser chrome follows the site's own light/dark palette. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#062718"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#14120e"
    />
    <meta name="color-scheme" content="light dark" />

    <title>CamboBook</title>
    <meta
      name="description"
      content="Discover and book tickets for concerts, festivals, sports, and cultural events across Cambodia. Reserved seating and general admission with instant Bakong KHQR & ABA PayWay payments, and digital QR ticket admission."
    />
    <meta
      name="keywords"
      content="Cambodia events, event ticketing Cambodia, Phnom Penh concerts, Siem Reap festivals, Bakong KHQR, ABA PayWay, CamboBook, buy tickets Cambodia, live entertainment"
    />
    <meta name="author" content="CamboBook" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="CamboBook" />
    <meta name="apple-mobile-web-app-title" content="CamboBook" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CamboBook" />
    <meta
      property="og:title"
      content="CamboBook — Event Ticketing in Cambodia"
    />
    <meta
      property="og:description"
      content="Discover, book, and experience events across all 25 provinces in Cambodia — reserved seating or general admission with instant Bakong KHQR and ABA PayWay checkout."
    />
    <meta property="og:image" content="/logo/CB-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="km_KH" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="CamboBook — Event Ticketing in Cambodia"
    />
    <meta
      name="twitter:description"
      content="Discover, book, and experience events across Cambodia — reserved seating, instant Bakong KHQR & ABA PayWay checkout, and digital QR tickets."
    />
    <meta name="twitter:image" content="/logo/CB-og.png" />
    <!-- Latin + Khmer faces: Khmer script needs its own family, not a fallback.
         Berkshire Swash and Moul are the hero headline only - one weight each,
         Latin and Khmer, loaded because a script face has no system fallback
         worth the name. Everything else stays on Inter / Noto Sans Khmer. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Inter:wght@400;500;600;700;800&family=Moul&family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Deferred: this is a third-party script on someone else's network, and
         without `defer` it blocks parsing of <body>, so a slow or unreachable
         PayWay leaves #root uncreated and the whole app renders as a blank
         page. Nothing runs it at load - PaywayCheckout.jsx reaches for it only
         once a user starts a payment - so it has no reason to hold up first
         paint. -->
    <script
      defer
      src="https://checkout.payway.com.kh/plugins/checkout2-0.js"
    ></script>

    <!-- Apply the saved theme before first paint. ThemeContext does the same
         once React runs, but by then the splash below has already been drawn
         in whatever colours the stylesheet guessed. Same key, same fallback. -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      })()
    </script>

    <!-- Splash. Inlined rather than in index.css because the bundle is what we
         are waiting on: this has to paint before any of it arrives. Colours
         are the page/brand tokens from index.css, copied by value. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #f6f3ec;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      [data-theme='dark'] #splash { background: #14120e; }
      #splash.is-done { opacity: 0; visibility: hidden; }
      /* Mark and name on one row, like .nav-brand. Height drives the mark so
         it lines up with the cap height of the name beside it. */
      #splash .splash-lockup { display: flex; align-items: center; gap: 12px; }
      #splash img { height: 52px; width: auto; }
      /* Same face and weight as .nav-brand-text, so the splash hands over to
         the navbar without the name changing shape. Two-tone like the logo
         lockup: the place in the dark green, the action in the lighter one. */
      #splash .splash-word {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #0d4a2d;
      }
      #splash .splash-word span { color: #208a52; }
      [data-theme='dark'] #splash .splash-word { color: #f2ece0; }
      [data-theme='dark'] #splash .splash-word span { color: #6fc99a; }
      #splash .splash-dots { display: flex; gap: 8px; }
      #splash .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #157e4e;
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      [data-theme='dark'] #splash .splash-dots span { background: #6fc99a; }
      #splash .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      #splash .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-dots span { animation: none; opacity: 0.7; }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading CamboBook">
      <div class="splash-lockup">
        <img src="/logo/CB-mark.png" alt="" width="280" height="320" />
        <p class="splash-word" aria-hidden="true">Cambo<span>Book</span></p>
      </div>
      <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <!-- Safety net: if the bundle fails to load or throws before hiding the
         splash, don't leave people staring at a spinner forever. -->
    <script>
      setTimeout(function () {
        var s = document.getElementById('splash')
        if (s) s.remove()
      }, 10000)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
