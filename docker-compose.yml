services:
  postgres:
    image: postgres:16-alpine
    container_name: event-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-event_booking}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Host port intentionally non-default (not 5432) so this doesn't collide
      # with other Postgres containers you already have running in Docker
      # Desktop. Container-internal port stays 5432 - only the host side
      # (left of the colon) needed to move.
      - "${DB_PORT:-55432}:5432"
    volumes:
      - event_booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-event_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: event-booking-pgadmin
    restart: unless-stopped
    environment:
      # pgAdmin validates this as an email format and rejects reserved
      # TLDs (.local, .test, .example, .invalid, .localhost) even though
      # it never actually sends mail here (CHECK_EMAIL_DELIVERABILITY is
      # off) - so this just needs to look like a normal address.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@eventbooking.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      # Also non-default (pgAdmin's usual convention is 5050) for the same
      # collision-avoidance reason as the DB port above.
      - "${PGADMIN_PORT:-55050}:80"
    volumes:
      - event_booking_pgadmin:/var/lib/pgadmin
      # Pre-registers the "Event Booking (local)" connection so it shows up
      # in the left sidebar on first login instead of you typing host/port/
      # db name in by hand. Only read on a fresh pgadmin volume.
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── Monitoring Stack ──────────────────────────────────────────────────
  # Prometheus scrapes /actuator/prometheus from your running Spring Boot
  # app (on the host machine) every 15 s and stores the time-series data.
  prometheus:
    image: prom/prometheus:latest
    container_name: event-booking-prometheus
    restart: unless-stopped
    ports:
      # Non-default host port to avoid colliding with another Prometheus
      # you might be running. Container internal port stays 9090.
      - "${PROMETHEUS_PORT:-59090}:9090"
    volumes:
      # Scrape configuration — which targets Prometheus pulls from.
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Persistent storage so metrics survive a container restart.
      - event_booking_prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    # Allow Prometheus inside the container to reach your Spring Boot app
    # on the host machine via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana reads from Prometheus and renders the dashboards.
  grafana:
    image: grafana/grafana:latest
    container_name: event-booking-grafana
    restart: unless-stopped
    ports:
      # Non-default host port, same collision-avoidance reason as above.
      - "${GRAFANA_PORT:-53000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Disable sign-up to keep the local UI clean.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Persistent storage for dashboards you create/edit in the UI.
      - event_booking_grafana:/var/lib/grafana
      # Auto-provisions the Prometheus datasource + the Spring Boot dashboard
      # from ./monitoring/grafana/provisioning/ on first startup.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  event_booking_pgdata:
  event_booking_pgadmin:
  event_booking_prometheus:
  event_booking_grafana:

