services:
  postgres:
    image: postgres:16-alpine
    container_name: event-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-event_booking}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - event_booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-event_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  event_booking_pgdata:
